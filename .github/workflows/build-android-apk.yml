name: Build VectorCraft Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VectorCraft APK for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/

      - name: Build WebAssembly Core
        working-directory: apps/vectorcraft-web
        run: |
          trunk build --release

      - name: Copy WebAssembly Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r apps/vectorcraft-web/dist/* android/app/src/main/assets/dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/VectorCraft-v0.24.1-android.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VectorCraft-v0.24.1-android-apk
          path: build-output/VectorCraft-v0.24.1-android.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.24.1-android
          name: VectorCraft v0.24.1 Android Release (Redmi Pad 2)
          body: |
            ### VectorCraft v0.24.1 for Android (Redmi Pad 2 / HyperOS 3 / Android 16)
            
            - **Target:** Redmi Pad 2 (Helio G100-Ultra, RAM 4GB, Android 16 / HyperOS 3)
            - **Optimized:** Memory safe (~250 MB RAM footprint, anti-force close / anti-OOM)
            - **Stylus Support:** Full pressure, tilt, and touch support.
            
            Unduh file APK di bawah ini dan instal langsung di tablet Anda.
          files: build-output/VectorCraft-v0.24.1-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
