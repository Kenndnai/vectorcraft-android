name: Build VectorCraft for Android (PWA / Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-pwa:
    name: Build VectorCraft Web & PWA for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/

      - name: Build WebAssembly Release
        working-directory: apps/vectorcraft-web
        run: |
          trunk build --release

      - name: Upload Web/PWA Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-web-android-pwa
          path: apps/vectorcraft-web/dist
